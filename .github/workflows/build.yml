name: Build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Build linux-amd64
        run: GOOS=linux GOARCH=amd64 go build -o easy-novnc-linux-amd64 .

      - name: Build windows-amd64
        run: GOOS=windows GOARCH=amd64 go build -o easy-novnc-windows-amd64.exe .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easy-novnc
          path: |
            easy-novnc-linux-amd64
            easy-novnc-windows-amd64.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            easy-novnc-linux-amd64
            easy-novnc-windows-amd64.exe
          generate_release_notes: true
